name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v5

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          package/unique_name="com.mysteryexploration.game"
          package/name="Mystery Exploration"
          version/code=1
          version/name="1.0"
          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          architecture/x86_64=false
          architecture/x86=false
          EOF

      - name: Export Android APK
        uses: NodotProject/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.5/Godot_v4.5-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.5/Godot_v4.5-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          presets_to_export: Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mystery-Exploration-APK
          path: "**/*.apk"

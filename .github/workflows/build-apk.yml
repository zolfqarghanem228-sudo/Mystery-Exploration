name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Install Android requirements
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download Godot 4.5.1
        run: |
          mkdir -p "$HOME/.local/share/godot"

          wget -nv \
            "https://downloads.godotengine.org/?version=4.5.1&flavor=stable&slug=linux.x86_64.zip&platform=linux.64" \
            -O "$HOME/.local/share/godot/godot.zip"

          unzip -o \
            "$HOME/.local/share/godot/godot.zip" \
            -d "$HOME/.local/share/godot/"

          GODOT_BIN=$(find "$HOME/.local/share/godot" \
            -type f \
            -name "Godot_v4.5.1-stable_linux.x86_64" \
            | head -n 1)

          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot 4.5.1 executable not found."
            exit 1
          fi

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Download Godot 4.5.1 Export Templates
        run: |
          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable"

          wget -nv \
            "https://downloads.godotengine.org/?version=4.5.1&flavor=stable&slug=export_templates.tpz&platform=templates" \
            -O "$HOME/.local/share/godot/export_templates/export_templates.tpz"

          mkdir -p /tmp/godot_templates

          unzip -o \
            "$HOME/.local/share/godot/export_templates/export_templates.tpz" \
            -d /tmp/godot_templates

          TEMPLATE_DIR=$(find /tmp/godot_templates \
            -type d \
            -name "templates" \
            | head -n 1)

          if [ -z "$TEMPLATE_DIR" ]; then
            echo "ERROR: Godot export templates folder not found."
            exit 1
          fi

          cp -r "$TEMPLATE_DIR"/* \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

          echo "Godot 4.5.1 export templates installed."

      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          package/unique_name="com.mysteryexploration.game"
          package/name="Mystery Exploration"

          version/code=1
          version/name="1.0"

          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          architecture/x86_64=false
          architecture/x86=false

          export_format=0
          EOF

      - name: Export APK
        run: |
          mkdir -p build

          echo "========================================"
          echo "Starting Mystery Exploration APK export"
          echo "========================================"
          echo "Godot: 4.5.1"
          echo "Platform: Android"
          echo "Maximum export time: 45 minutes"
          echo "========================================"

          timeout 45m \
            "$GODOT_BIN" \
            --headless \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/Mystery-Exploration.apk"

      - name: Verify APK
        run: |
          echo "Checking APK..."

          if [ ! -f "build/Mystery-Exploration.apk" ]; then
            echo "ERROR: APK was not created."
            echo "Contents of build folder:"
            ls -lah build/
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "build/Mystery-Exploration.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mystery-Exploration-APK
          path: build/Mystery-Exploration.apk
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
          yes | sdkmanager --licenses || true

      - name: Create Android preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"

          [preset.0.options]

          package/unique_name="com.mysteryexploration.game"
          package/name="Mystery Exploration"
          version/code=1
          version/name="1.0"

          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          architecture/x86_64=false
          architecture/x86=false
          EOF

      - name: Export Android APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mystery-Exploration-APK
          path: "**/*.apk"

name: Diagnose Godot Import

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Download Godot 4.5.1
        run: |
          mkdir -p "$HOME/.local/share/godot"

          wget -nv \
            "https://downloads.godotengine.org/?version=4.5.1&flavor=stable&slug=linux.x86_64.zip&platform=linux.64" \
            -O "$HOME/.local/share/godot/godot.zip"

          unzip -o \
            "$HOME/.local/share/godot/godot.zip" \
            -d "$HOME/.local/share/godot/"

          GODOT_BIN=$(find "$HOME/.local/share/godot" \
            -type f \
            -name "Godot_v4.5.1-stable_linux.x86_64" \
            | head -n 1)

          if [ -z "$GODOT_BIN" ]; then
            echo "Godot executable not found"
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Find problematic import
        run: |
          echo "Starting Godot import diagnosis..."

          set +e

          timeout 10m \
            "$GODOT_BIN" \
            --headless \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --quit \
            2>&1 | tee godot-import.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "===== LAST 100 LINES ====="
          tail -100 godot-import.log

          echo ""
          echo "===== EXIT CODE ====="
          echo "$EXIT_CODE"

          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "Godot exceeded 10 minutes."
            echo "The last output above is what we need to inspect."
            exit 1
          fi

          exit "$EXIT_CODE"

      - name: Upload diagnosis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-import-diagnosis
          path: godot-import.log
          if-no-files-found: warn
